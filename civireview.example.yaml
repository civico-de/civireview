# civireview configuration example
# Place as `civireview.yaml` or `.civireview.yaml` in your repository root.

trigger: "@civireview"
# Login the reviews are posted as; only its comments then count as review markers.
# botLogin: my-review-bot

# Named model presets:
#   sonnet       -> Sonnet triage, specialists & verifier (API)
#   sonnet-opus  -> Sonnet triage & specialists, Opus verifier (API)
#   cross-model  -> Haiku triage, Sonnet specialists, GPT-5.2 verifier (API)
#   subscription -> Claude Code CLI subscription (haiku/sonnet/opus, zero API key)
#   local-gpu    -> OpenCode / OpenAI-compatible local server
preset: sonnet

# Optional per-stage model overrides (<provider>:<modelId>):
# Supported providers: anthropic, openai, google, openrouter, openai-compat,
#                      claude-cli, codex-cli, opencode-cli
# models:
  # triage: anthropic:claude-haiku-5-5
  # specialists:
    # correctness: anthropic:claude-sonnet-5-5
    # security: openai:gpt-5.2
    # tests: anthropic:claude-sonnet-5-5
    # ui: google:gemini-2.5-pro
  # verifier: anthropic:claude-opus-5-5
  # threadReply: anthropic:claude-sonnet-5-5

# Layer 1 CiviKitchen A/B verification options (Standalone only)
ab:
  enabled: true
  runDemo: false
  runMatrix: false
  keepStacks: false
  liveProve: false
  # civikitchenPath: /path/to/civikitchen
  # ckCommand: ck

# Layer 1 check toggles. `lifecycle` covers the lifecycle and the upgrade-parity gate
# of extensions, including extensions bundled with civicrm-core (ext/<name>).
checks:
  abTests: true
  surface: true
  staticDelta: true
  lifecycle: true
  browser: true
  a11y: true
  interactiveBrowser: false # Tier 2 Playwright MCP (local/opt-in)
  matrix: false
  liveProve: false

# Standalone browser A/B configuration
browser:
  # Explicit civicrm/... routes to always probe (in addition to auto-discovered routes)
  pages: []
  # Anonymous routes to probe without login
  anonymousPages: []
  maxAutoPages: 5
  sendScreenshotsToLlm: true
  # playwrightMcpCommand: npx -y @playwright/mcp@latest

# CiviCRM Knowledge MCP scope isolation
# Public repos ALWAYS connect to publicUrl with zero team token.
# Private repos use teamUrl + env[tokenEnv] when configured.
mcp:
  enabled: true
  publicUrl: https://mcp.civico.de/mcp
  # teamUrl: https://your-team-mcp.example.com/mcp
  tokenEnv: CIVICRM_MCP_TOKEN

# Review gate, effort control, include/exclude controls, & GitHub publishing behavior
review:
  confidenceThreshold: 80
  maxInlineComments: 10
  maxDiffBytes: 250000
  # Depth profile: fast | balanced | deep. It sets maxSteps, triageMaxSteps,
  # maxOutputTokens, maxFollowUpRounds and stageTimeoutMs; set one of those here
  # only to override the profile.
  depth: deep
  # maxSteps: 35
  # Stop a review whose estimated cost reaches this amount (USD); unset = no cap.
  # maxBudgetUsd: 2
  # Reasoning effort: auto (dynamic per stage & PR risk) | low | medium | high | xhigh | max
  effort: auto
  # Optional per-stage effort overrides:
  # stageEffort:
  #   triage: low
  #   specialists: medium
  #   verifier: high
  #   threadReply: medium
  autoPost: true
  reviewEvent: COMMENT # COMMENT | REQUEST_CHANGES | APPROVE
  # Optional allowlist/denylist of check keys (ab-tests, surface, static-delta,
  # lifecycle, browser, a11y, interactive-browser, matrix, live-prove) and
  # specialist lenses (correctness, security, tests, ui):
  include: []
  exclude: []
  # Optional diff path glob filters (*, **, ?):
  paths:
    include: []
    exclude: []
    #   - "docs/**"

# Cross-repo mention watcher (`civireview watch`)
watch:
  mode: search # search | notifications
  repos:
    - civicrm/civicrm-core
  # REQUIRED for security: configure at least one of allowedAuthors, allowedOrgs,
  # or allowedAssociations.
  allowedAuthors: []
  # Authorize all members (public and private) of a GitHub organization:
  allowedOrgs:
    - civicrm
  # Optional GitHub author_association allowlist (OWNER, MEMBER, COLLABORATOR, CONTRIBUTOR):
  allowedAssociations: []
  # Rolling cost & abuse guardrails (excess mentions are deferred, not dropped):
  maxReviewsPerHour: 10
  maxDailyUsd: 15
  # Ignore historical mentions older than N minutes (cold-start safety):
  maxCommentAgeMinutes: 1440
  # Prevent PR commenters from switching to arbitrary models/presets:
  lockModels: true
  intervalSec: 60
  statePath: .civireview-state/seen.json
